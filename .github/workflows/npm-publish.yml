name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run MCP verification
        run: |
          npm run verify:versions
          npm run build
          npm run smoke

      - name: Publish package
        run: npm publish --provenance --access public

      - name: Wait for npm registry propagation
        run: |
          package_version="$(node -p "require('./package.json').version")"
          for attempt in {1..12}; do
            if npm view "@openfate/bazi-mcp@${package_version}" version >/dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for @openfate/bazi-mcp@${package_version} to become visible (attempt ${attempt}/12)..."
            sleep 10
          done
          echo "::error::@openfate/bazi-mcp@${package_version} did not become visible within 120 seconds."
          exit 1

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" |
            tar xz mcp-publisher

      - name: Publish MCP Registry metadata
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
